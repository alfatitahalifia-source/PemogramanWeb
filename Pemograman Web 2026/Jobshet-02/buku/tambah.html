<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header>
    <h1>SIMPUS-Mini</h1>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

    <nav>
        <ul>
            <li><a href="../index.html">Beranda</a></li>
            <li><a href="list.html">Daftar Buku</a></li>
            <li><a href="tambah.html">Tambah Buku</a></li>
            <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
        </ul>
    </nav>
</header>
<form>
    <p>
        <label for="judul">Judul:</label><br>
        <input type="text" id="judul" name="judul" required><br>
    </p>
    <p>
        <label for="pengarang">Pengarang:</label><br>
        <input type="text" id="pengarang" name="pengarang" required><br>
    </p>
    <p>
        <label for="tahun">Tahun Terbit:</label><br>
        <input type="number" id="tahun" name="tahun" required><br>
    </p>
    <p>
        <label for="isbn">ISBN:</label><br>
        <input type="number" id="isbn" name="isbn"><br>
    </p>
    <p>
        <label for="stok">Stok:</label><br>
        <input type="number" id="stok" name="stok" required><br>
    </p>
    <p>
        <label for="kategori">Kategori:</label><br>
        <select id="kategori" name="kategori">
            <option value="Fiksi">Fiksi</option>
            <option value="Non-Fiksi">Non-Fiksi</option>
            <option value="Referensi">Referensi</option>
        </select>
    </p>
    <p>
        <button type="submit">Simpan</button>
    </p>
</form>
